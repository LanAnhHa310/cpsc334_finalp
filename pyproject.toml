[project]
name = "cpsc334-finalp"
version = "0.1.0"
description = "A Python-based web scraper to help researchers and scholars find reputable research papers easily."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "pytest>=9.0.3",
    "requests>=2.33.1",
]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
